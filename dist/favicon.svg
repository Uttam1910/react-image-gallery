<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="lumoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="lumoraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Gradient Background Rounded Tile -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#lumoraGrad)" />
  
  <!-- Subtle Glass Inner Border -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="12" />

  <!-- Bright White Lumora Star Spark Icon -->
  <path d="M256 100 L288 208 L396 240 L288 272 L256 380 L224 272 L116 240 L224 208 Z" fill="#ffffff" filter="url(#lumoraGlow)" />
  <circle cx="360" cy="140" r="22" fill="#ffffff" opacity="0.9" />
  <circle cx="150" cy="350" r="16" fill="#ffffff" opacity="0.8" />
</svg>
